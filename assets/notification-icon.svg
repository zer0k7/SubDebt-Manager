<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <!-- Mask to punch out transparent cuts for dollar, seams, and snap button -->
    <mask id="notifMask">
      <!-- White everywhere allows shapes to show -->
      <rect width="96" height="96" fill="#FFFFFF" />
      
      <!-- Black cuts out transparency -->
      <!-- Gap between peeking items and wallet body -->
      <line x1="10" y1="32" x2="86" y2="32" stroke="#000000" stroke-width="3" />
      
      <!-- Flap outline / seam -->
      <path d="M 62,44 L 80,44 A 8,8 0 0,1 88,52 L 88,58 A 8,8 0 0,1 80,66 L 62,66" fill="none" stroke="#000000" stroke-width="3" />
      <circle cx="78" cy="55" r="3" fill="#000000" />

      <!-- Centered Crisp Cutout Dollar Symbol -->
      <line x1="40" y1="41" x2="40" y2="69" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
      <text x="40" y="56" font-family="system-ui, -apple-system, Roboto, sans-serif" font-weight="900" font-size="26" fill="#000000" text-anchor="middle" dominant-baseline="central">$</text>
    </mask>
  </defs>

  <g mask="url(#notifMask)">
    <!-- 1. Subscription Card (Tilted Left) -->
    <rect x="22" y="15" width="28" height="22" rx="4" transform="rotate(-10 36 26)" fill="#FFFFFF"/>
    
    <!-- 2. Receipt / Invoice (Tilted Right) -->
    <path d="M 48,19 L 52,14 L 56,19 L 60,14 L 64,19 L 68,14 L 72,19 L 72,36 L 48,36 Z" transform="rotate(8 60 26)" fill="#FFFFFF"/>

    <!-- 3. Wallet Body -->
    <rect x="12" y="32" width="72" height="46" rx="12" fill="#FFFFFF"/>
  </g>
</svg>
